name: Build curalightningV1 Portable

on:
  workflow_dispatch:
  push:
    branches:
      - looped-lightning-poc
    paths:
      - '.github/workflows/build-looped-lightning-cura-portable.yml'

permissions:
  contents: read
  actions: read

jobs:
  build-windows-portable:
    runs-on: windows-latest

    steps:
      - name: Setup Cura build environment
        id: setup-environment
        uses: ultimaker/cura-workflows/.github/actions/setup-build-environment@main
        with:
          repository: Ultimaker/Cura
          branch: main
          repository_path: _cura_sources
          install_system_dependencies: true
          python_set_env_vars: false
          cura_workflows_branch: main

      - name: Download our proven Looped Lightning CuraEngine artifact
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $artifactId = '10040918612'
          $zip = Join-Path $env:RUNNER_TEMP 'looped-lightning-engine.zip'
          $out = Join-Path $env:GITHUB_WORKSPACE 'custom-engine'
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          $headers = @{ Authorization = "Bearer $env:GH_TOKEN"; Accept = 'application/vnd.github+json'; 'X-GitHub-Api-Version' = '2022-11-28' }
          Invoke-WebRequest -Headers $headers -Uri "https://api.github.com/repos/AZgunNut/CuraEngine/actions/artifacts/$artifactId/zip" -OutFile $zip
          Expand-Archive -Path $zip -DestinationPath $out -Force
          $engine = Get-ChildItem -Path $out -Recurse -Filter CuraEngine.exe | Select-Object -First 1
          if (-not $engine) { throw 'CuraEngine.exe was not found in the downloaded artifact.' }
          $canonicalEngine = Join-Path $out 'CuraEngine.exe'
          if ($engine.FullName -ne $canonicalEngine) { Copy-Item $engine.FullName $canonicalEngine -Force }
          Get-FileHash $canonicalEngine -Algorithm SHA256

      - name: Prepare Cura installer Conan profile
        id: set-overrides
        uses: ultimaker/cura-workflows/.github/actions/set-package-overrides@main
        with:
          package_overrides: ''
          profile: installer.jinja

      - name: Disable Sentry for independent portable build
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $pydir = Get-Content pydir.txt
          $env:PATH += ";$pydir;$pydir/Scripts"
          $profileName = '${{ steps.set-overrides.outputs.profile }}'
          $profile = (conan profile path $profileName).Trim()
          if (-not (Test-Path $profile)) { throw "Conan profile not found: $profile" }
          $text = Get-Content -Path $profile -Raw
          $text = $text -replace 'arcus/\*:enable_sentry=True', 'arcus/*:enable_sentry=False'
          $text = $text -replace 'clipper/\*:enable_sentry=True', 'clipper/*:enable_sentry=False'
          $text = $text -replace 'curaengine/\*:enable_sentry=True', 'curaengine/*:enable_sentry=False'
          Set-Content -Path $profile -Value $text -Encoding ASCII

      - name: Gather and build Cura packages
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $pydir = Get-Content pydir.txt
          $env:PATH += ";$pydir;$pydir/Scripts"
          $curaVersion = '${{ steps.setup-environment.outputs.package_version }}'
          conan install --requires "cura/$curaVersion@ultimaker/testing" --build=missing -of cura_inst --deployer-package="*" --profile '${{ steps.set-overrides.outputs.profile }}'

      - name: Create full Cura distribution
        shell: cmd
        run: |
          call cura_inst\conanrun.bat
          python -m venv cura_installer_venv
          call cura_installer_venv\Scripts\Activate.bat
          python -m pip install -r cura_inst\packaging\pip_requirements_core_basic.txt --no-warn-script-location
          python -m pip install -r cura_inst\packaging\pip_requirements_core_hashes.txt --no-warn-script-location
          python -m pip install -r cura_inst\packaging\pip_requirements_installer_basic.txt --no-warn-script-location
          python Cura-workflows\runner_scripts\prepare_installer.py --os Windows --architecture X64 --summary-output %GITHUB_STEP_SUMMARY% --variables-output %GITHUB_OUTPUT%
          pyinstaller cura_inst\UltiMaker-Cura.spec

      - name: Insert Looped Lightning engine and isolated curalightningV1 launcher
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $dist = Join-Path $env:GITHUB_WORKSPACE 'dist\UltiMaker-Cura'
          if (-not (Test-Path (Join-Path $dist 'UltiMaker-Cura.exe'))) { throw 'Full Cura distribution was not created.' }
          Copy-Item (Join-Path $env:GITHUB_WORKSPACE 'custom-engine\CuraEngine.exe') (Join-Path $dist 'CuraEngine.exe') -Force
          Rename-Item (Join-Path $dist 'UltiMaker-Cura.exe') 'curalightningV1.exe' -Force
          $launcherLines = @(
            '@echo off', 'setlocal', 'set "ROOT=%~dp0"',
            'if not exist "%ROOT%curalightningV1-data\Roaming" mkdir "%ROOT%curalightningV1-data\Roaming"',
            'if not exist "%ROOT%curalightningV1-data\Local" mkdir "%ROOT%curalightningV1-data\Local"',
            'set "APPDATA=%ROOT%curalightningV1-data\Roaming"',
            'set "LOCALAPPDATA=%ROOT%curalightningV1-data\Local"',
            'start "curalightningV1" "%ROOT%curalightningV1.exe"', 'endlocal'
          )
          Set-Content -Path (Join-Path $dist 'START-curalightningV1.cmd') -Value $launcherLines -Encoding ASCII
          $readmeLines = @(
            'curalightningV1 - EXPERIMENTAL LOOPED LIGHTNING CURA', '',
            'This build is isolated from normal Cura user data.',
            'Start it with START-curalightningV1.cmd.',
            'Its APPDATA and LOCALAPPDATA live under curalightningV1-data beside the program.',
            'It does NOT copy or import the normal Cura profile tree.',
            'Normal Cura is not modified.', '',
            'In V1, ordinary Lightning infill invokes the experimental loop-closing Lightning engine.',
            'Custom engine source: AZgunNut/CuraEngine branch looped-lightning-poc.'
          )
          Set-Content -Path (Join-Path $dist 'README-curalightningV1.txt') -Value $readmeLines -Encoding UTF8
          Get-FileHash (Join-Path $dist 'CuraEngine.exe') -Algorithm SHA256

      - name: Package curalightningV1
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $zip = Join-Path $env:GITHUB_WORKSPACE 'curalightningV1-Windows-X64.zip'
          if (Test-Path $zip) { Remove-Item $zip -Force }
          Compress-Archive -Path "$env:GITHUB_WORKSPACE\dist\UltiMaker-Cura\*" -DestinationPath $zip -CompressionLevel Optimal
          Get-Item $zip | Format-List Name,Length,FullName
          Get-FileHash $zip -Algorithm SHA256

      - name: Upload curalightningV1
        uses: actions/upload-artifact@v4
        with:
          name: curalightningV1-Windows-X64
          path: curalightningV1-Windows-X64.zip
          retention-days: 30
