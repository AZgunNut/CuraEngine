name: curalightning-v2-windows

on:
  push:
    branches:
      - CURA-looped-lightning-proof-v2
    paths:
      - 'include/**'
      - 'src/**'
      - 'tools/patch_cura_lightning_v2.py'
      - '.github/workflows/curalightning-v2-windows.yml'
      - 'conanfile.py'
      - 'conandata.yml'
      - 'CMakeLists.txt'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-v2-windows:
    runs-on: windows-latest

    steps:
      - name: Set up CuraEngine build environment
        uses: ultimaker/cura-workflows/.github/actions/setup-build-environment@main
        with:
          repository: AZgunNut/CuraEngine
          branch: CURA-looped-lightning-proof-v2
          repository_path: CuraEngine
          install_system_dependencies: false

      - name: Verify V2 source commit
        shell: pwsh
        working-directory: CuraEngine
        run: |
          $sha = (git rev-parse HEAD).Trim()
          Write-Host "CuraLightning V2 source commit: $sha"
          if (-not (Select-String -Path 'src/infill/LightningGenerator.cpp' -Pattern 'lightning_experimental_variant' -Quiet)) {
            throw 'V2 selector plumbing is missing from CuraEngine source'
          }
          if (-not (Select-String -Path 'src/infill/LightningLayer.cpp' -Pattern 'experimental_variant == 21' -Quiet)) {
            throw 'V2 experimental variants are missing from LightningLayer source'
          }

      - name: Build CuraLightning V2 CuraEngine
        shell: bash
        working-directory: CuraEngine
        run: |
          conan create . --build=missing -c tools.build:skip_test=True

      - name: Collect exact CuraEngine executable
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path v2-stage\engine | Out-Null
          $matches = Get-ChildItem "$env:USERPROFILE\.conan2" -Recurse -Filter CuraEngine.exe -ErrorAction SilentlyContinue
          if (-not $matches) { throw 'CuraEngine.exe was not found in the Conan cache' }
          $engine = $matches | Sort-Object LastWriteTime -Descending | Select-Object -First 1
          Copy-Item $engine.FullName v2-stage\engine\CuraEngine.exe
          Get-FileHash v2-stage\engine\CuraEngine.exe -Algorithm SHA256 | Format-List

      - name: Fetch matching Cura frontend
        shell: pwsh
        run: |
          git clone --depth 1 https://github.com/Ultimaker/Cura.git CuraFrontend
          git -C CuraFrontend rev-parse HEAD

      - name: Add Stock plus Experimental 1 through 22 selector
        shell: pwsh
        run: |
          python CuraEngine\tools\patch_cura_lightning_v2.py CuraFrontend

      - name: Verify patched Cura resources
        shell: pwsh
        run: |
          $definition = Get-Content CuraFrontend\resources\definitions\fdmprinter.def.json -Raw | ConvertFrom-Json
          $setting = $definition.settings.infill.children.lightning_experimental_variant
          if ($null -eq $setting) { throw 'lightning_experimental_variant is missing from Cura resources' }
          if ($setting.options.PSObject.Properties.Count -ne 23) { throw 'Expected Stock plus 22 experimental choices' }
          if (-not (Select-String -Path CuraFrontend\resources\setting_visibility\expert.cfg -Pattern '^lightning_experimental_variant$' -Quiet)) {
            throw 'V2 selector is missing from expert visibility'
          }

      - name: Stage V2 packaging inputs
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path v2-stage\cura-resources\definitions | Out-Null
          New-Item -ItemType Directory -Force -Path v2-stage\cura-resources\setting_visibility | Out-Null
          Copy-Item CuraFrontend\resources\definitions\fdmprinter.def.json v2-stage\cura-resources\definitions\fdmprinter.def.json
          Copy-Item CuraFrontend\resources\setting_visibility\expert.cfg v2-stage\cura-resources\setting_visibility\expert.cfg
          Set-Content -Path v2-stage\BUILD_INFO.txt -Value @(
            'CuraLightning V2 Windows packaging pipeline',
            'Selector: Stock + Experimental 1..22',
            "CuraEngine branch: CURA-looped-lightning-proof-v2",
            "Pipeline commit: $env:GITHUB_SHA",
            "Built: $(Get-Date -Format o)"
          )

      - name: Upload verified V2 staging artifact
        uses: actions/upload-artifact@v4
        with:
          name: curalightningV2-windows-staging
          path: v2-stage/
          if-no-files-found: error
