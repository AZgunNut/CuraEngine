name: curalightning-v2-windows

on:
  push:
    branches:
      - CURA-looped-lightning-proof-v2
    paths:
      - 'include/**'
      - 'src/**'
      - 'tools/patch_cura_lightning_v2.py'
      - '.github/workflows/curalightning-v2-windows.yml'
      - 'conanfile.py'
      - 'conandata.yml'
      - 'CMakeLists.txt'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-v2-windows:
    runs-on: windows-latest

    steps:
      - name: Set up CuraEngine build environment
        uses: ultimaker/cura-workflows/.github/actions/setup-build-environment@main
        with:
          repository: AZgunNut/CuraEngine
          branch: CURA-looped-lightning-proof-v2
          repository_path: CuraEngine
          install_system_dependencies: false

      - name: Verify CuraLightning controls source
        shell: pwsh
        working-directory: CuraEngine
        run: |
          $sha = (git rev-parse HEAD).Trim()
          Write-Host "CuraLightning V2 source commit: $sha"
          foreach ($pattern in @('lightning_smoothing', 'lightning_offset_widths', 'lightning_single_path')) {
            if (-not (Select-String -Path 'src/infill/LightningGenerator.cpp' -Pattern $pattern -Quiet)) {
              throw "Missing CuraLightning generator control: $pattern"
            }
            if (-not (Select-String -Path 'src/infill/LightningLayer.cpp' -Pattern $pattern -Quiet)) {
              throw "Missing CuraLightning layer control: $pattern"
            }
          }
          if (-not (Select-String -Path 'src/infill/LightningLayer.cpp' -Pattern 'properSegmentsCross' -Quiet)) {
            throw 'No-cross path protection is missing from LightningLayer source'
          }

      - name: Build CuraLightning V2 CuraEngine
        shell: bash
        working-directory: CuraEngine
        run: |
          conan create . --build=missing -c tools.build:skip_test=True

      - name: Collect exact CuraEngine executable
        shell: pwsh
        run: |
          $stage = Join-Path $env:GITHUB_WORKSPACE 'v2-stage'
          $engineDir = Join-Path $stage 'engine'
          $engineOut = Join-Path $engineDir 'CuraEngine.exe'
          New-Item -ItemType Directory -Force -Path $engineDir | Out-Null
          $matches = @(Get-ChildItem "$env:USERPROFILE\.conan2" -Recurse -Filter CuraEngine.exe -File -ErrorAction SilentlyContinue)
          if ($matches.Count -eq 0) { throw 'CuraEngine.exe was not found in the Conan cache' }
          Write-Host "Found $($matches.Count) CuraEngine.exe candidate(s)."
          $engine = $matches | Sort-Object LastWriteTimeUtc -Descending | Select-Object -First 1
          Write-Host "Using CuraEngine.exe: $($engine.FullName)"
          Write-Host "LastWriteTimeUtc: $($engine.LastWriteTimeUtc.ToString('o'))"
          Copy-Item -LiteralPath $engine.FullName -Destination $engineOut -Force
          Get-FileHash -LiteralPath $engineOut -Algorithm SHA256 | Format-List

      - name: Fetch clean Cura frontend
        shell: pwsh
        run: |
          $frontend = 'v2-cura-frontend'
          if (Test-Path -LiteralPath $frontend) {
            Write-Host "Removing pre-existing frontend directory: $frontend"
            Remove-Item -LiteralPath $frontend -Recurse -Force
          }
          if (Test-Path -LiteralPath $frontend) { throw "Could not clear frontend directory: $frontend" }
          git clone --depth 1 https://github.com/Ultimaker/Cura.git $frontend
          if ($LASTEXITCODE -ne 0) { throw 'Cura frontend clone failed' }
          $curaSha = (git -C $frontend rev-parse HEAD).Trim()
          if (-not $curaSha) { throw 'Could not determine Cura frontend commit' }
          Write-Host "Cura frontend commit: $curaSha"
          "CURA_FRONTEND_SHA=$curaSha" >> $env:GITHUB_ENV

      - name: Add CuraLightning controls to Cura frontend
        shell: pwsh
        run: |
          python CuraEngine\tools\patch_cura_lightning_v2.py v2-cura-frontend
          if ($LASTEXITCODE -ne 0) { throw 'Cura frontend patch failed' }

      - name: Stage V2 packaging inputs
        shell: pwsh
        run: |
          $stage = Join-Path $env:GITHUB_WORKSPACE 'v2-stage'
          $definitionsDir = Join-Path $stage 'cura-resources\definitions'
          $visibilityDir = Join-Path $stage 'cura-resources\setting_visibility'
          New-Item -ItemType Directory -Force -Path $definitionsDir | Out-Null
          New-Item -ItemType Directory -Force -Path $visibilityDir | Out-Null
          Copy-Item v2-cura-frontend\resources\definitions\fdmprinter.def.json (Join-Path $definitionsDir 'fdmprinter.def.json') -Force
          Copy-Item v2-cura-frontend\resources\setting_visibility\expert.cfg (Join-Path $visibilityDir 'expert.cfg') -Force
          Set-Content -Path (Join-Path $stage 'BUILD_INFO.txt') -Value @(
            'CuraLightning V2 Windows packaging pipeline',
            'Controls: smoothing 0..100; offset 0..100 extrusion widths; single path on/off',
            'No-cross rule: enabled',
            'CuraEngine branch: CURA-looped-lightning-proof-v2',
            "Pipeline commit: $env:GITHUB_SHA",
            "Cura frontend commit: $env:CURA_FRONTEND_SHA",
            "Built: $(Get-Date -Format o)"
          )

      - name: Upload verified V2 staging artifact
        uses: actions/upload-artifact@v4
        with:
          name: curalightningV2-windows-staging
          path: ${{ github.workspace }}/v2-stage/
          if-no-files-found: error
